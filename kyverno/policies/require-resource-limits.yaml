apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Containers without resource limits can consume all cluster
      resources causing Denial of Service.
      This policy blocks Scenario 13 - DoS via resource exhaustion.
      Also prevents crypto miners from stealing cluster resources.
      MITRE ATT&CK T1496 - Resource Hijacking.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: check-resource-limits
    match:
      any:
      - resources:
          kinds:
          - Pod
    exclude:                    
      any:
      - resources:
          namespaces:
          - kube-system
          - kyverno
          - argocd
          - linkerd
          - linkerd-viz
    validate:
      message: >-
        Resource limits are required for all containers.
        This prevents DoS attacks (Scenario 13) and crypto mining.
        Add resources.limits.memory and resources.limits.cpu.
      pattern:
        spec:
          containers:
          - resources:
              limits:
                memory: "?*"
                cpu: "?*"